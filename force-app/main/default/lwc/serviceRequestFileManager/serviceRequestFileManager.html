<template>
<lightning-card icon-name="standard:account" variant="base" title="Service Request Files">
<div class="table-container">
<table class="slds-table slds-table_cell-buffer slds-table_bordered">
    <thead>
        <tr>
            <th> 
                <div class="slds-truncate">File Name</div>
            </th>
            <th>
                <div class="slds-truncate">File </div>
            </th>
        <th> <div class="slds-truncate"> File Size </div></th>
        <th> <div class="slds-truncate"> Uploaded By </div></th>
        <th> <div class="slds-truncate"> Uploaded Date </div></th>
        <th>  <div class="slds-truncate"> Status</div></th>
        <th><div class="slds-truncate">Select</div></th>
        </tr>
    </thead>
    <tbody>
        <template for:each={serviceRequestFiles} for:item="files">
            <tr key={files.id} class={files.rowClass}>
                <td>{files.fileName}</td>
                <td>{files.fileType}</td>
                <td>{files.fileSize}</td>
                <td>{files.uploadedName}</td>
                <td>{files.uploadedDate}</td>
                <td >
                    <template if:true={files.isOriginal}>
                        ORIGINAL
                    </template>
                    <template if:true={files.isDuplicate}>
                        DUPLICATE
                    </template>
                </td>
                <td>
                    <template if:true={files.isDuplicate}>
                        <input type="checkbox" 
                                data-id={files.id}
                                oncheck={files.isSelected}
                                onchange={handleOnChange}/>
                    </template>
                </td>
            </tr>
        </template>
    </tbody>
</table>
    <br/>
        <lightning-button 
            variant="destructive"
            label="Delete Duplicate Files" 
            onclick={handleOnDeleteClick} disabled={isDeleteDisabled}
        ></lightning-button>
</div>
    <template if:false={serviceRequestFiles}>
        <div>No files Attached To This Service Request</div>
    </template>
    <template if:true={isDeleteConfiramtion}>
        <section role="dialog" tabindex="-1"
            aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Confirm Deletion </h2>
                    </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>
                        Are you sure you want to delete the selected duplicate file?
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel"
                        onclick={handleCancelDelete}>
                    </lightning-button>
                    <lightning-button
                        label="Delete"
                        variant="destructive"
                        onclick={handleConfirmDelete}
                        class="slds-m-left_small">
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</lightning-card>
</template>
