<template>
     <lightning-card icon-name="standard:account" title="Account Details">
        <lightning-datatable key-field="Id"
                             columns={cols}
                             data={accountData}
                             hide-checkbox-column=true
                             onrowaction={handleEditButton}
                             >
        </lightning-datatable>

        <template if:true={isEditOpenForm}>
          <!--Now desinging part -->
          <section  role="dialog"
                    tabindex="-1"
                    aria-modal="true"
                    aria-labelledby="modal-heading"
                    class="slds-modal slds-fade-in-open" >
           <!--Modal Container -->
                <div class="slds-modal__container">
                   <header class="slds-modal__header">
                      <h2 id="slds-modalheading"
                          class="slds-text_heading__medium">
                        Edit Account
                      </h2>
                    </header>
                    <!--Body container -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-edit-form
                          object-api-name="Account"
                          record-id={selectedRecordId}
                          onsuccess={handleSave}
                          onerror={handleCancel}
                        >  
                        <lightning-layout multiple-rows>
                              <lightning-layout-item size="6">
                                  <lightning-input-field field-name="AccountOwner">
                                  </lightning-input-field>
                                  <lightning-input-field field-name="Name">
                                  </lightning-input-field>
                                  <lightning-input-field field-name="ParentId">
                                  </lightning-input-field>
                                  <lightning-input-field field-name="AccountNumber">
                                  </lightning-input-field>
                                  <lightning-input-field field-name="Type">
                                  </lightning-input-field>
                                  <lightning-input-field field-name="AnnualRevenue">
                                  </lightning-input-field>
                                  <lightning-input-field field-name="ShippingAddress">
                                  </lightning-input-field>
                                  <lightning-input-field field-name="SLAExpirationDate__c">
                                  </lightning-input-field>
                              </lightning-layout-item>

                              <lightning-layout-item size="6">
                                    <lightning-input-field field-name="Rating">
                                    </lightning-input-field>
                                    <lightning-input-field field-name="Phone">
                                    </lightning-input-field>
                                    <lightning-input-field field-name="Fax">
                                    </lightning-input-field>
                                    <lightning-input-field field-name="Industry">
                                    </lightning-input-field>
                                    <lightning-input-field field-name="BillingAddress">
                                    </lightning-input-field>
                                    <lightning-input-field field-name="SLA__c">
                                    </lightning-input-field> 
                                    <lightning-input-field field-name="SLASerialNumber__c">
                                    </lightning-input-field>
                               </lightning-layout-item>
                          
                        </lightning-layout>
                       <div class="slds-modal__footer">
                                <!-- Cancel -->
                                <lightning-button
                                    label="Cancel"
                                    onclick={handleCancel}>
                                </lightning-button>
                                <!-- Save -->
                                <lightning-button
                                    class="slds-m-left_small"
                                    type="submit"
                                    label="Save"
                                    variant="brand">
                                </lightning-button>

                            </div>
                       </lightning-record-edit-form>
                    </div>
            </div>
          </section>
           <div
            class="slds-backdrop slds-backdrop_open">
        </div>
        </template>
     </lightning-card>
</template>
