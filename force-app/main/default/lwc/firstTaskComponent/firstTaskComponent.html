<template>
    <lightning-card title="Task Component" >
        <lightning-input type="text" label="Enter Title Name" name="tTitle" 
        placeholder="Enter the Task" value={title}
        onchange={handleOnChange}>
        </lightning-input>
        <lightning-combobox
            name="priority"
            label="Status"
            value={priority}
            placeholder="Select Priority"
            options={priorityOptions}
            onchange={handleOnChange} >
        </lightning-combobox>

        <lightning-button variant="neutral" label="Add To List" title="titleName" 
                          onclick={handleClick}>
        </lightning-button>
       <template for:each={taskList} for:item="tasks">
         <div key={tasks.id}>
            <p>
                <strong>Title: {tasks.title}</strong>
            </p>
            <p>
             <strong>Priority : {tasks.priority}</strong>
            </p>
            
         </div>
       </template>
    </lightning-card>
</template>
