<template>
        <lightning-card icon-name="standard:account" variant="base">
         
         <template if:true={caseFiles.length}>  
            <div class="table-container">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th scope="col">
                                    <div class="slds-truncate"> File Name</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate">  File Type </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate"> File Size</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate">Uploaded By</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate">Uploaded Date</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate">Status</div>
                                </th>
                                <th class="col">
                                    <div class="slds-truncate">Select</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                                <template for:each={caseFiles} for:item="files">
                                        <tr key={files.id} class={files.rowClass}>
                                            <td class={files.cellClass}>{files.fileName}</td>
                                            <td class={files.cellClass}>{files.fileType}</td>
                                            <td class={files.cellClass}>{files.fileSize}</td>
                                            <td class={files.cellClass}>{files.UploadedBy}</td>
                                            <td class={files.cellClass}>{files.UploadedDate}</td>
                                            <td class={files.cellClass}>
                                                <template if:true={files.isOriginal}>
                                                    ORIGINAL
                                                </template>
                                                <template if:true={files.isDuplicate}>
                                                    DUPLICATE
                                                </template>
                                            </td>
                                            <td class={files.cellClass}>
                                                <!--Only im giving the check box for duplicate files-->
                                                <template if:true={files.isDuplicate} >
                                                     <input type="checkbox"
                                                            data-id={files.id}
                                                            checked={files.isSelected}
                                                            onchange={handleFileSelection}
                                                        />
                                                </template>
                                            </td>
                                        </tr>
                                </template>
                        </tbody>
                 </table>
                 <br/>
                 <div class="slds-m-bottom-medium">
                    <lightning-button 
                      variant="destructive"
                      label="Delete Selected File"  disabled={isDeleteDisabled}
                      onclick={handleDeleteClick} 
                    ></lightning-button>
                 </div>
            </div>
         </template>
         
         <template if:false={caseFiles}>
            <h2>No Files Attached To This Case</h2>
         </template>
         <template if:true={isDeleteConfirmation}>
            <section role="dialog" tabindex="-1"
                aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">Confirm Deletion </h2>
                        </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>
                            Are you sure you want to delete the selected duplicate file?
                        </p>
                        <strong>{selectedFileName}</strong>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel"
                            onclick={handleCancelDelete}>
                        </lightning-button>
                        <lightning-button
                            label="Delete"
                            variant="destructive"
                            onclick={handleConfirmDelete}
                            class="slds-m-left_small">
                        </lightning-button>
                    </footer>
                </div>
           </section>
            <div class="slds-backdrop slds-backdrop_open"></div>

         </template>
        </lightning-card>
</template>
